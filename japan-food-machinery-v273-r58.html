<script id="jfm-app">
(()=>{'use strict';
const DATA_URL='data/japan_food_machinery_db_v075.json';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const safe=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const text=v=>String(v??'').trim()||'確認できません';
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/[,，]/g,'').replace(/\s+/g,' ').trim();
let db=null, mode='manufacturers', route='food', selected=new Set(), shown=30, lastResults=[];
const routeConfig={food:['食品から探す','food_groups','food'],process:['工程から探す','process_groups','process'],challenge:['課題から探す','challenge_groups','challenge'],maker:['メーカーから探す',null,null]};
const fields=['q','makerFilter','prefFilter','unitFilter','capacityMin','capacityMax','powerFilter','sort','flagshipOnly','pdfOnly','overseasOnly','numericOnly','sanitaryOnly'];
function setOptions(id,items){const el=$(id);items.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)})}
function tokenGroups(q){return norm(q).split(' ').filter(Boolean).map(token=>{for(const [key,values] of Object.entries(db.aliases||{})){const all=[key,...values].map(norm);if(all.some(x=>x===token||x.includes(token)||token.includes(x)))return [...new Set([token,...all])]}return [token]})}
function productHay(m){return norm([m.manufacturer_name,m.brand_name,m.product_name,m.model_number,m.machine_category,m.process_stage,m.target_foods,m.capacity_public,m.batch_capacity,m.tact_public,m.main_effects_public,m.power_supply,m.sanitation_features,m.line_connection,m.options_public,m.product_summary_public,m.overseas_relevance,...(m.food_groups||[]),...(m.process_groups||[]),...(m.challenge_groups||[])].join(' '))}
function makerHay(m){return norm(Object.values(m).filter(v=>typeof v==='string'||typeof v==='number').join(' '))}
function scoreProduct(m,q){if(!q)return (m.is_flagship?35:0)+(m.has_overseas?8:0)+(m.has_pdf?5:0)+m.completeness/10;const groups=tokenGroups(q),hay=productHay(m);if(!groups.every(group=>group.some(t=>hay.includes(t))))return -1;let s=0,nq=norm(q),model=norm(m.model_number),name=norm(m.product_name),maker=norm(m.manufacturer_name),cat=norm(m.machine_category);if(model&&nq===model)s+=220;else if(model&&model.includes(nq))s+=130;if(name===nq)s+=150;else if(name.includes(nq))s+=90;if(maker===nq)s+=120;else if(maker.includes(nq))s+=65;if(cat.includes(nq))s+=50;groups.forEach(group=>{const t=group.find(x=>hay.includes(x))||group[0];if(name.includes(t))s+=20;if(model.includes(t))s+=25;if(maker.includes(t))s+=12;if(norm(m.target_foods).includes(t))s+=14;if(norm(m.process_stage).includes(t))s+=14;if(norm(m.main_effects_public).includes(t))s+=12;if(norm(m.product_summary_public).includes(t))s+=7});if(m.is_flagship)s+=20;if(m.has_overseas)s+=6;if(m.has_pdf)s+=5;return s}
function productPass(m){const q=$('#q').value.trim();m._score=scoreProduct(m,q);if(m._score<0)return false;if(selected.size){const key=routeConfig[route][1];if(route==='maker'){if(!selected.has(m.manufacturer_name))return false}else if(![...(m[key]||[])].some(v=>selected.has(v)))return false}const maker=$('#makerFilter').value;if(maker&&m.manufacturer_name!==maker)return false;const pref=$('#prefFilter').value;if(pref&&db.manufacturers.find(x=>x['メーカー']===m.manufacturer_name)?.['都道府県']!==pref)return false;const unit=$('#unitFilter').value;if(unit&&m.capacity_unit!==unit)return false;const min=Number($('#capacityMin').value),max=Number($('#capacityMax').value);if((min||max)&&!m.has_numeric_capacity)return false;if(min&&Number(m.capacity_value_max)<min)return false;if(max&&Number(m.capacity_value_min)>max)return false;const power=$('#powerFilter').value,ps=norm(m.power_supply);if(power==='三相200V'&&!(ps.includes('200v')&&ps.includes('三相')))return false;if(power==='単相100V'&&!(ps.includes('100v')&&(ps.includes('単相')||ps.includes('交流')||ps.includes('ac100v'))))return false;if(power==='不要'&&!ps.includes('不要'))return false;if($('#flagshipOnly').checked&&!m.is_flagship)return false;if($('#pdfOnly').checked&&!m.has_pdf)return false;if($('#overseasOnly').checked&&!m.has_overseas)return false;if($('#numericOnly').checked&&!m.has_numeric_capacity)return false;if($('#sanitaryOnly').checked&&!m.has_sanitation)return false;return true}
function makerPass(m,matchingProducts){const q=$('#q').value.trim(),hasMatch=matchingProducts.some(x=>x.manufacturer_name===m['メーカー']);if(q&&!makerHay(m).includes(norm(q))&&!hasMatch)return false;if(selected.size&&route==='maker'&&!selected.has(m['メーカー']))return false;const productFilterActive=(selected.size&&route!=='maker')||$('#unitFilter').value||$('#capacityMin').value||$('#capacityMax').value||$('#powerFilter').value||$('#flagshipOnly').checked||$('#pdfOnly').checked||$('#numericOnly').checked||$('#sanitaryOnly').checked;if(productFilterActive&&!hasMatch)return false;const maker=$('#makerFilter').value;if(maker&&m['メーカー']!==maker)return false;const pref=$('#prefFilter').value;if(pref&&m['都道府県']!==pref)return false;if($('#overseasOnly').checked&&!m.has_overseas)return false;return true}
function sortProducts(rows){const type=$('#sort').value;return rows.sort((a,b)=>type==='maker'?a.manufacturer_name.localeCompare(b.manufacturer_name,'ja')||a.product_name.localeCompare(b.product_name,'ja'):type==='capacity'?(Number(b.capacity_value_max)||-1)-(Number(a.capacity_value_max)||-1):type==='complete'?b.completeness-a.completeness:type==='flagship'?(b.is_flagship-a.is_flagship)||b._score-a._score:b._score-a._score||a.manufacturer_name.localeCompare(b.manufacturer_name,'ja'))}
function badges(m){return [m.is_flagship?'<span class="badge flagship">看板商品</span>':'',m.has_overseas?'<span class="badge overseas">海外関連</span>':'',m.has_pdf?'<span class="badge pdf">公式PDF</span>':'',`<span class="badge">${safe(text(m.machine_category))}</span>`].join('')}
function detail(label,value){return `<div class="detail-row"><b>${safe(label)}</b><span>${safe(text(value))}</span></div>`}
function productCard(m){const ref=m.reference_url?`<a class="action" href="${safe(m.reference_url)}" target="_blank" rel="noopener">${m.has_pdf?'公式PDF':'公式情報'}</a>`:'';return `<article class="result-card" id="${safe(m.id)}" data-entity-id="${safe(m.id)}"><div class="product-main"><div class="card-top"><div class="card-title"><div class="eyebrow">${safe(m.id)}</div><h3>${safe(text(m.product_name))}${m.model_number?`<span class="model">${safe(m.model_number)}</span>`:''}</h3><div class="maker-name">${safe(m.manufacturer_name)}${m.brand_name?`｜${safe(m.brand_name)}`:''}</div></div></div><div class="badge-row">${badges(m)}</div><p class="description">${safe(text(m.product_summary_public))}</p><div class="summary-grid"><div class="summary-item"><b>対象食品</b><span>${safe(text(m.target_foods))}</span></div><div class="summary-item"><b>工程</b><span>${safe(text(m.process_stage))}</span></div><div class="summary-item"><b>能力</b><span>${safe(text(m.capacity_public))}</span></div><div class="summary-item"><b>電源</b><span>${safe(text(m.power_supply))}</span></div></div><div class="card-actions">${ref}<button class="action subtle" data-maker-products="${safe(m.manufacturer_name)}" type="button">同じメーカーを見る</button></div></div><details class="details"><summary>仕様・衛生・ライン接続の詳細を見る</summary><div class="detail-grid">${detail('主な効果',m.main_effects_public)}${detail('バッチ容量',m.batch_capacity)}${detail('タクト',m.tact_public)}${detail('対応重量',m.supported_weight_range)}${detail('対応サイズ',m.supported_size_range)}${detail('消費電力',m.power_consumption)}${detail('熱源',m.heat_source)}${detail('圧縮空気',m.air_requirement)}${detail('外形寸法',m.dimensions_public)}${detail('重量',m.weight_public)}${detail('衛生・洗浄',m.sanitation_features)}${detail('ライン接続',m.line_connection)}${detail('オプション',m.options_public)}${detail('海外関連',m.overseas_relevance)}${detail('情報確認日',m.last_checked)}</div></details></article>`}
function makerCard(m,matchingProducts){const count=matchingProducts.filter(x=>x.manufacturer_name===m['メーカー']).length;const link=m['会社概要URL']?`<a class="action subtle" href="${safe(m['会社概要URL'])}" target="_blank" rel="noopener">会社HP</a>`:'';return `<article class="result-card" id="${safe(m._target_id)}" data-entity-id="${safe(m._target_id)}"><div class="maker-main"><div class="card-title"><div class="eyebrow">${safe(text(m['都道府県']))}</div><h3>${safe(m['メーカー'])}</h3><div class="maker-name">登録製品 ${m.product_count_actual}件${m.product_count_actual===0?'｜製品詳細は未登録':''}</div></div><p class="description">${safe(text(m['事業内容']))}</p><div class="summary-grid"><div class="summary-item"><b>重点分野</b><span>${safe(text(m['重点分野']))}</span></div><div class="summary-item"><b>所在地</b><span>${safe(text(m['本社所在地']))}</span></div><div class="summary-item"><b>設立・創業</b><span>${safe(text(m['設立・創業']))}</span></div><div class="summary-item"><b>社員数</b><span>${safe(text(m['社員数']))}</span></div></div><div class="maker-products">現在の検索条件に一致する製品：${count}件</div><details class="maker-details"><summary>会社・海外展開情報を見る</summary><div class="detail-grid">${detail('売上高',m['売上高'])}${detail('海外代理店・販売網',m['海外代理店・販売網（社名＋URL）'])}${detail('確認日',m['会社情報確認日'])}${detail('調査状況',m['会社概要調査状況'])}</div></details><div class="card-actions maker-secondary-actions">${link}${m.product_count_actual?`<button class="action subtle" data-maker-products="${safe(m['メーカー'])}" type="button">製品を見る</button>`:''}</div></div></article>`}
function render(){if(!db)return;const products=sortProducts(db.machines.filter(productPass));lastResults=products;let rows=mode==='products'?products:db.manufacturers.filter(m=>makerPass(m,products)).sort((a,b)=>b.product_count_actual-a.product_count_actual||a['メーカー'].localeCompare(b['メーカー'],'ja'));$('#resultTitle').textContent=mode==='products'?'製品・型式':'メーカー';$('#resultMeta').textContent=`${rows.length.toLocaleString()}件表示｜元データ ${mode==='products'?db.counts.machines:db.counts.manufacturers}件`;const slice=rows.slice(0,shown);$('#results').innerHTML=slice.length?slice.map(x=>mode==='products'?productCard(x):makerCard(x,products)).join(''):'<div class="empty">条件に合う情報はありません。検索語を短くするか、絞り込みを解除してください。</div>';$('#loadMore').hidden=rows.length<=shown;$('#loadMore').textContent=`さらに表示（残り ${(rows.length-shown).toLocaleString()}件）`;bindDynamic();updateUrl()}
function bindDynamic(){$$('[data-maker-products]').forEach(b=>b.onclick=()=>{mode='products';$$('.mode-tab').forEach(x=>x.classList.toggle('active',x.dataset.mode==='products'));$('#makerFilter').value=b.dataset.makerProducts;shown=30;render();scrollTo({top:$('.search-shell').offsetTop-10,behavior:'smooth'})})}
function renderRoute(){const [title,key,countKey]=routeConfig[route];$('#routeTitle').textContent=title;let items;if(route==='maker'){items=db.manufacturers.filter(x=>x.product_count_actual>0).sort((a,b)=>b.product_count_actual-a.product_count_actual).slice(0,24).map(x=>[x['メーカー'],x.product_count_actual])}else items=db.facets[key].map(v=>[v,db.facet_counts[countKey][v]||0]);$('#routeChips').innerHTML=items.map(([v,c])=>`<button class="chip ${selected.has(v)?'active':''}" data-value="${safe(v)}" type="button">${safe(v)}<small>${c}</small></button>`).join('');$$('.chip').forEach(b=>b.onclick=()=>{selected.has(b.dataset.value)?selected.delete(b.dataset.value):selected.add(b.dataset.value);b.classList.toggle('active');shown=30;render()})}
function updateUrl(){const u=new URL(location.href);const q=$('#q').value.trim();q?u.searchParams.set('q',q):u.searchParams.delete('q');u.searchParams.set('mode',mode);history.replaceState(null,'',u)}
function reset(){fields.forEach(id=>{const el=$('#'+id);if(!el)return;if(el.type==='checkbox')el.checked=false;else if(id==='sort')el.value='relevance';else el.value='' });selected.clear();shown=30;renderRoute();render()}
async function start(){try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);db=await r.json();$('#stats').innerHTML=[['メーカー',db.counts.manufacturers],['製品・型式',db.counts.machines],['製品情報あり',db.counts.manufacturers_with_products],['能力数値あり',db.counts.numeric_capacity],['看板商品',db.counts.flagship],['公式PDF',db.counts.pdf]].map(([l,v])=>`<div class="stat"><b>${Number(v).toLocaleString()}</b><span>${l}</span></div>`).join('');setOptions('#makerFilter',db.facets.manufacturers);setOptions('#prefFilter',db.facets.prefectures);setOptions('#unitFilter',db.facets.capacity_units);db.manufacturers.forEach((maker,index)=>{maker._target_id=`jfm-maker-${String(index+1).padStart(4,'0')}`});const params=new URLSearchParams(location.search),incomingTarget=(params.get('mb_target')||params.get('target')||'').trim();$('#q').value=params.get('q')||'';mode=params.get('mode')==='products'?'products':'manufacturers';if(/^JFM-\d+$/i.test(incomingTarget)){mode='products';const exact=db.machines.find(machine=>String(machine.id).toLowerCase()===incomingTarget.toLowerCase());if(exact)$('#q').value=[exact.manufacturer_name,exact.product_name,exact.model_number].filter(Boolean).join(' ')}else if(/^jfm-maker-\d{4}$/i.test(incomingTarget)){mode='manufacturers';const exact=db.manufacturers.find(maker=>maker._target_id.toLowerCase()===incomingTarget.toLowerCase());if(exact)$('#q').value=exact['メーカー']}$$('.mode-tab').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));renderRoute();render()}catch(e){$('#results').innerHTML=`<div class="error">データを読み込めませんでした。実サーバー経由で開くか、ページを更新してください。<br>${safe(e.message)}</div>`}}
$$('.mode-tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$('.mode-tab').forEach(x=>x.classList.toggle('active',x===b));shown=30;render()});$$('.route-tab').forEach(b=>b.onclick=()=>{route=b.dataset.route;selected.clear();$$('.route-tab').forEach(x=>x.classList.toggle('active',x===b));renderRoute();shown=30;render()});$('#q').addEventListener('input',()=>{shown=30;render()});['makerFilter','prefFilter','unitFilter','powerFilter','sort','flagshipOnly','pdfOnly','overseasOnly','numericOnly','sanitaryOnly'].forEach(id=>$('#'+id).addEventListener('change',()=>{shown=30;render()}));['capacityMin','capacityMax'].forEach(id=>$('#'+id).addEventListener('input',()=>{shown=30;render()}));$('#clearAll').onclick=reset;$('#clearRoute').onclick=()=>{selected.clear();renderRoute();shown=30;render()};$$('.preset-chip').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.query;shown=30;render()});$('#loadMore').onclick=()=>{shown+=30;render()};start();
})();
</script>
