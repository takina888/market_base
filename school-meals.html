<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国別学校給食DB | MARKET BASE</title>
  <meta name="description" content="GCNFとWFPを使った国別学校給食DB。ランキングは1指標1基準資料で表示します。" />
  <style>
    :root{--blue:#0B3A82;--blue2:#1759b8;--bg:#f5f8fc;--card:#fff;--text:#132238;--muted:#607086;--line:#dbe7f6;--soft:#eef6ff;--green:#0f766e;--amber:#b45309;--shadow:0 14px 34px rgba(11,58,130,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
    a{color:inherit}.page{max-width:1180px;margin:0 auto;padding:16px 14px 72px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--blue);background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:950;box-shadow:0 8px 18px rgba(11,58,130,.04)}.status{color:var(--muted);font-size:.82rem;font-weight:850;text-align:right}.hero{background:linear-gradient(135deg,#fff 0%,#f6f9ff 60%,#eef6ff 100%);border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow)}.hero h1{margin:0 0 8px;color:var(--blue);font-size:clamp(1.45rem,4vw,2.25rem);line-height:1.15}.hero p{margin:0;color:var(--muted);font-weight:800;line-height:1.75}.tools{display:grid;grid-template-columns:1fr;gap:10px;margin:16px 0}@media(min-width:860px){.tools{grid-template-columns:1.4fr .8fr .8fr .8fr}}input,select,button{font:inherit}input,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px 14px;font-weight:850;background:#fff;color:var(--text);box-shadow:0 8px 18px rgba(11,58,130,.03)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 18px}@media(min-width:860px){.stats{grid-template-columns:repeat(4,1fr)}}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{display:block;color:var(--blue);font-size:1.45rem;line-height:1.1}.stat span{color:var(--muted);font-size:.86rem;font-weight:850}.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:24px 0 10px;color:var(--blue)}.section-title h2{margin:0;font-size:1.24rem}.source-note{font-size:.82rem;color:var(--muted);font-weight:850;line-height:1.5;text-align:right}.ranking-wrap{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:980px){.ranking-wrap{grid-template-columns:1fr 1fr}}.rank-card,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 24px rgba(11,58,130,.04)}.rank-card h3,.card h3{margin:0 0 8px;color:var(--blue);font-size:1.08rem}.rank-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0}.rank-row:first-of-type{border-top:0}.rank-no{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:950}.rank-country{font-weight:950}.rank-val{font-weight:950;color:var(--blue2);text-align:right}.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}.card h2{margin:0 0 8px;color:var(--blue);font-size:1.12rem;line-height:1.35}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pill{display:inline-flex;border-radius:999px;background:var(--soft);color:var(--blue);padding:5px 9px;font-size:.78rem;font-weight:950}.pill.green{background:#ecfdf5;color:var(--green)}.pill.amber{background:#fffbeb;color:var(--amber)}.muted{color:var(--muted);font-size:.92rem;line-height:1.65;font-weight:750}.keyvals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}@media(min-width:520px){.keyvals{grid-template-columns:repeat(4,1fr)}}.kv{background:#f8fbff;border:1px solid var(--line);border-radius:14px;padding:9px}.kv b{display:block;color:var(--blue);font-size:1rem}.kv span{display:block;color:var(--muted);font-size:.76rem;font-weight:850}.summary-box{background:#fbfdff;border:1px solid var(--line);border-radius:14px;padding:10px;line-height:1.65;font-weight:760;color:#314256}details{margin-top:10px}summary{cursor:pointer;color:var(--blue2);font-weight:950}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}th,td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left;vertical-align:top;line-height:1.45}th{color:var(--blue);background:#f8fbff;width:34%}.empty{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted);font-weight:850}.small{font-size:.82rem}.error{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:18px;padding:16px;font-weight:850;line-height:1.7}
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar"><a class="back" href="./">← MARKET BASE</a><div class="status">V179 / Standalone / 本体JS非統合</div></div>
    <section class="hero"><h1>国別学校給食DB</h1><p>GCNFを中核に、WFPの対象児童数・予算データを重ねた別ページDBです。ランキングは1指標につき基準資料を1つに固定し、他資料を混ぜません。</p></section>
    <section id="app"></section>
  </main>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=n=>n===null||n===undefined||n===""?"—":Number(n).toLocaleString("ja-JP",{maximumFractionDigits:1});
const short=s=>!s?"":String(s).length>260?String(s).slice(0,260)+"…":String(s);
const state={cards:[],rankings:{},metricMeta:{},q:"",region:"all",priority:"all",metric:"school_meals_total_children"};
async function loadJson(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error(path+" "+r.status);return r.json();}
function metricLabel(mid){return state.metricMeta[mid]?.metric_label_ja||state.metricMeta[mid]?.metric||mid}
function sourceNote(mid){return state.metricMeta[mid]?.ui_source_note_ja||state.metricMeta[mid]?.definition_note_ja||state.metricMeta[mid]?.primary_source_for_ranking||""}
function regions(){return [...new Set(state.cards.map(x=>x.region).filter(Boolean))].sort()}
function filteredCards(){const q=state.q.toLowerCase();return state.cards.filter(c=>{const hay=JSON.stringify(c).toLowerCase();return(!q||hay.includes(q))&&(state.region==="all"||c.region===state.region)&&(state.priority==="all"||c.json_card_priority===state.priority)})}
function renderRankings(){const mids=Object.keys(state.rankings);if(!mids.includes(state.metric))state.metric=mids[0]||"";const list=(state.rankings[state.metric]||[]).slice(0,12);return `<div class="section-title"><h2>ランキング</h2><div class="source-note">${esc(sourceNote(state.metric))}</div></div><div class="tools" style="grid-template-columns:1fr"><select id="metric">${mids.map(mid=>`<option value="${esc(mid)}" ${mid===state.metric?"selected":""}>${esc(metricLabel(mid))}</option>`).join("")}</select></div><div class="ranking-wrap"><div class="rank-card"><h3>${esc(metricLabel(state.metric))}</h3>${list.length?list.map((r,i)=>`<div class="rank-row"><span class="rank-no">${i+1}</span><span class="rank-country">${esc(r.country)} <span class="small muted">${esc(r.iso3||"")}</span></span><span class="rank-val">${fmt(r.value)} ${esc(r.unit||"")}</span></div>`).join(""):`<div class="empty">この指標のランキングデータがありません。</div>`}<p class="muted small">出典：${esc((list[0]&&list[0].source)||state.metricMeta[state.metric]?.primary_source_for_ranking||"")}</p></div><div class="rank-card"><h3>ランキング方針</h3><p class="muted">1指標につき基準資料を1つに固定しています。WFP指標とGCNF指標を同じランキング内で混ぜません。中央厨房・調理拠点数は、GCNF 2021 infrastructure内で数値表現が明確なものだけを採用しています。</p></div></div>`}
function renderCard(c){const infra=c.infrastructure||{},children=c.children||{},budget=c.budget||{},coverage=c.coverage||{},meal=c.meal_modalities||{},programs=c.programs_2021||[];const badges=[c.region,c.reference_school_year,c.json_card_priority,infra.central_or_offsite_status_2021,infra.infrastructure_summary_ja].filter(Boolean);return `<article class="card"><h2>${esc(c.country)} <span class="small muted">${esc(c.iso3||"")}</span></h2><div class="meta">${badges.map((b,i)=>`<span class="pill ${i>2?"green":""}">${esc(b)}</span>`).join("")}</div><div class="keyvals"><div class="kv"><b>${fmt(children.wfp_children_latest||children.gcnf_total_children_fed)}</b><span>給食対象児童</span></div><div class="kv"><b>${fmt(budget.wfp_budget_usd||budget.gcnf_budget_usd)}</b><span>予算 USD</span></div><div class="kv"><b>${fmt(coverage.coverage_rate_pct)}%</b><span>提供率</span></div><div class="kv"><b>${fmt(infra.central_kitchen_count_extracted_2021)}</b><span>中央厨房・拠点数</span></div></div>${infra.infrastructure_summary_ja?`<div class="summary-box">${esc(infra.infrastructure_summary_ja)}</div>`:""}<table><tr><th>プログラム</th><td>${esc(short(c.program_names)||"—")}</td></tr><tr><th>主管機関</th><td>${esc(short(c.lead_agency)||"—")}</td></tr><tr><th>食事形態</th><td>${["朝食:"+meal.breakfast,"昼食:"+meal.lunch,"スナック:"+meal.snacks,"持ち帰り:"+meal.take_home_rations].filter(x=>!x.endsWith("undefined")&&!x.endsWith("null")).map(esc).join(" / ")||"—"}</td></tr><tr><th>設備カテゴリ</th><td>${esc(["学校キッチン:"+infra.kitchens_category,"食堂:"+infra.cafeterias_category,"電気:"+infra.electricity_category,"清潔な水:"+infra.clean_water_category].filter(x=>!x.endsWith("undefined")&&!x.endsWith("null")).join(" / ")||"—")}</td></tr></table>${infra.infrastructure_text_2021?`<details><summary>設備・調理・配送メモ</summary><p class="muted">${esc(infra.infrastructure_text_2021)}</p></details>`:""}${programs.length?`<details><summary>プログラム別情報 ${programs.length}件</summary><table><thead><tr><th>プログラム</th><th>頻度</th><th>対象</th><th>児童数</th></tr></thead><tbody>${programs.map(p=>`<tr><td>${esc(p.program||"")}</td><td>${esc(p.frequency||"")}</td><td>${esc(short(p.targeting)||"")}</td><td>${fmt(p.total_children_fed)}</td></tr>`).join("")}</tbody></table></details>`:""}<p class="muted small">データ強度：${esc(c.data_strength||"—")}　調査ギャップ：${esc(c.research_gap||"—")}</p></article>`}
function render(){const regs=regions(),cards=filteredCards();app.innerHTML=`<div class="tools"><input id="q" value="${esc(state.q)}" placeholder="国名・中央厨房・配送・プログラム名などで検索"><select id="region"><option value="all">すべての地域</option>${regs.map(r=>`<option value="${esc(r)}" ${state.region===r?"selected":""}>${esc(r)}</option>`).join("")}</select><select id="priority"><option value="all">すべて</option><option value="High" ${state.priority==="High"?"selected":""}>中央厨房・拠点情報あり</option><option value="Medium" ${state.priority==="Medium"?"selected":""}>設備文章あり</option><option value="Basic" ${state.priority==="Basic"?"selected":""}>基礎データ</option></select><select id="sort"><option>国別カード</option></select></div><div class="stats"><div class="stat"><b>${fmt(state.cards.length)}</b><span>国・地域カード</span></div><div class="stat"><b>${fmt(cards.length)}</b><span>表示中</span></div><div class="stat"><b>${fmt(regs.length)}</b><span>地域分類</span></div><div class="stat"><b>${fmt(state.cards.filter(c=>(c.infrastructure||{}).central_kitchen_count_extracted_2021).length)}</b><span>中央厨房数あり</span></div></div>${renderRankings()}<div class="section-title"><h2>国別DBカード</h2><div class="source-note">GCNF国別データ・GCNF 2021 infrastructure・WFP指標をカード内で併記</div></div><div class="grid">${cards.length?cards.map(renderCard).join(""):`<div class="empty">該当する国・地域がありません。</div>`}</div>`;$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});$("#region").addEventListener("change",e=>{state.region=e.target.value;render()});$("#priority").addEventListener("change",e=>{state.priority=e.target.value;render()});const metric=$("#metric");if(metric)metric.addEventListener("change",e=>{state.metric=e.target.value;render()})}
(async()=>{try{const [cards,rankings,sources]=await Promise.all([loadJson("data/school_meals_country_cards.json"),loadJson("data/school_meals_rankings.json"),loadJson("data/school_meals_sources.json")]);state.cards=cards.records||[];state.rankings=rankings.rankings_by_metric||{};state.metricMeta=rankings.metric_meta||sources.metric_meta||{};render()}catch(e){app.innerHTML=`<div class="error">学校給食DBの読み込みに失敗しました。<br>${esc(e.message)}</div>`;console.error(e)}})();
</script>
</body>
</html>
