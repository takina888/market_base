<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学校給食DB | MARKET BASE</title>
  <meta name="description" content="国別の学校給食、中央厨房、対象児童数、予算を整理します。" />
  <style>
    :root{--blue:#0B3A82;--blue2:#1759b8;--bg:#f5f8fc;--text:#132238;--muted:#607086;--line:#dbe7f6;--soft:#eef6ff;--green:#0f766e;--amber:#b45309;--shadow:0 12px 28px rgba(11,58,130,.08)}
    *{box-sizing:border-box} html,body{max-width:100%;overflow-x:hidden} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
    .page{width:min(1120px,100%);margin:0 auto;padding:14px 12px 72px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--blue);background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:950}.lang{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--blue);font-weight:900;padding:9px 10px;max-width:145px}
    .hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1{margin:0;color:var(--blue);font-size:clamp(1.35rem,5vw,2rem);line-height:1.2}.hero p{margin:8px 0 0;color:var(--muted);font-weight:800;line-height:1.65}
    .tools{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0}@media(min-width:820px){.tools{grid-template-columns:1.4fr .8fr .8fr}}input,select{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px;font:inherit;font-weight:850;background:#fff;color:var(--text)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 18px}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;color:var(--blue);font-size:1.35rem}.stat span{color:var(--muted);font-size:.84rem;font-weight:850}
    .section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:22px 0 10px}.section-title h2{margin:0;color:var(--blue);font-size:1.18rem}.note{font-size:.82rem;color:var(--muted);font-weight:850;text-align:right;line-height:1.5}.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}.card,.rank-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 18px rgba(11,58,130,.04);min-width:0}.card h3,.rank-card h3{margin:0 0 8px;color:var(--blue);font-size:1.08rem;line-height:1.35;word-break:break-word}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pill{display:inline-flex;border-radius:999px;background:var(--soft);color:var(--blue);padding:5px 9px;font-size:.78rem;font-weight:950}.pill.green{background:#ecfdf5;color:var(--green)}
    .keyvals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.kv{background:#f8fbff;border:1px solid var(--line);border-radius:13px;padding:9px;min-width:0}.kv b{display:block;color:var(--blue);font-size:1rem;word-break:break-word}.kv span{display:block;color:var(--muted);font-size:.76rem;font-weight:850}.summary{background:#fbfdff;border:1px solid var(--line);border-radius:13px;padding:10px;color:#314256;line-height:1.65;font-weight:760;word-break:break-word}.muted{color:var(--muted);font-size:.92rem;line-height:1.65;font-weight:750}details{margin-top:10px}summary{cursor:pointer;color:var(--blue2);font-weight:950}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.88rem}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;line-height:1.45;word-break:break-word}th{width:34%;color:var(--blue);background:#f8fbff}.rank-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;border-top:1px solid var(--line);padding:10px 0}.rank-row:first-of-type{border-top:0}.rank-no{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:950}.rank-country{font-weight:950;line-height:1.35}.rank-val{font-weight:950;color:var(--blue2);margin-top:4px}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);font-weight:850}.small{font-size:.82rem}@media(max-width:520px){.page{padding-left:10px;padding-right:10px}.rank-row{grid-template-columns:30px minmax(0,1fr)}.hero{padding:14px}.topbar{align-items:flex-start}.back,.lang{font-size:.9rem}.tools{gap:8px}}
  </style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <a class="back" href="./">← MARKET BASE</a>
    <select id="langSelect" class="lang" aria-label="Language">
      <option value="ja">日本語</option><option value="en">English</option><option value="zh_tw">繁體中文</option><option value="zh_cn">简体中文</option>
    </select>
  </div>
  <section class="hero">
    <h1 data-t="title">学校給食DB</h1>
    <p data-t="lead">国別の学校給食、中央厨房、対象児童数、予算を整理します。</p>
  </section>
  <section id="app"></section>
</main>
<script>
const $=s=>document.querySelector(s), app=$("#app");
let lang=localStorage.getItem("mb_lang")||"ja";
const TEXT={
 ja:{title:"学校給食DB",lead:"国別の学校給食、中央厨房、対象児童数、予算を整理します。",search:"国名・中央厨房・配送・プログラム名で検索",allRegions:"すべての地域",allStatus:"すべて",high:"中央厨房・拠点情報あり",medium:"設備文章あり",basic:"基礎データ",cards:"国別DBカード",ranking:"ランキング",reference:"参考データ",policy:"ランキングは1指標につき基準資料を1つに固定しています。1件だけの中央厨房・調理拠点数はランキングではなく参考データとして表示します。",children:"給食対象児童",budget:"予算",coverage:"提供率",central:"中央厨房・拠点数",program:"プログラム",agency:"主管機関",meal:"食事形態",facility:"設備カテゴリ",detail:"設備・調理・配送メモ",programDetail:"プログラム別情報",noRows:"該当する国・地域がありません。",source:"出典"},
 en:{title:"School Meals DB",lead:"Country-level school meals, central kitchens, covered children, and budgets.",search:"Search country, central kitchen, delivery, or program",allRegions:"All regions",allStatus:"All",high:"Central/off-site data",medium:"Infrastructure text",basic:"Basic data",cards:"Country cards",ranking:"Rankings",reference:"Reference data",policy:"Each ranking uses one primary source per metric. A central-kitchen metric with only one record is shown as reference data, not as a ranking.",children:"Children covered",budget:"Budget",coverage:"Coverage",central:"Central/off-site sites",program:"Program",agency:"Lead agency",meal:"Meal type",facility:"Facilities",detail:"Infrastructure and delivery note",programDetail:"Program details",noRows:"No matching countries.",source:"Source"},
 zh_tw:{title:"學校供餐DB",lead:"依國家整理學校供餐、中央廚房、受益學生數與預算。",search:"搜尋國家、中央廚房、配送、計畫名稱",allRegions:"所有地區",allStatus:"全部",high:"有中央廚房資料",medium:"有設備文字",basic:"基本資料",cards:"國別資料卡",ranking:"排名",reference:"參考資料",policy:"每個排名指標固定使用一個主要資料來源。中央廚房資料只有1筆時，不作排名，改為參考資料。",children:"受益學生",budget:"預算",coverage:"覆蓋率",central:"中央廚房／據點數",program:"計畫",agency:"主管機關",meal:"供餐形式",facility:"設備分類",detail:"設備・調理・配送備註",programDetail:"計畫別資訊",noRows:"沒有符合的國家／地區。",source:"來源"},
 zh_cn:{title:"学校供餐DB",lead:"按国家整理学校供餐、中央厨房、受益学生数与预算。",search:"搜索国家、中央厨房、配送、项目名称",allRegions:"所有地区",allStatus:"全部",high:"有中央厨房资料",medium:"有设备文字",basic:"基本资料",cards:"国家资料卡",ranking:"排名",reference:"参考资料",policy:"每个排名指标固定使用一个主要资料来源。中央厨房资料只有1条时，不作排名，改为参考资料。",children:"受益学生",budget:"预算",coverage:"覆盖率",central:"中央厨房／据点数",program:"项目",agency:"主管机构",meal:"供餐形式",facility:"设备分类",detail:"设备・调理・配送备注",programDetail:"项目别信息",noRows:"没有符合的国家／地区。",source:"来源"}
};
const REGION_JA={"East Asia & Pacific":"東アジア・太平洋","Europe & Central Asia":"ヨーロッパ・中央アジア","Latin America & Caribbean":"ラテンアメリカ・カリブ","Middle East & North Africa":"中東・北アフリカ","North America":"北米","South Asia":"南アジア","Sub-Saharan Africa":"サブサハラ・アフリカ","Africa":"アフリカ","Americas":"アメリカ","Asia":"アジア","Europe":"ヨーロッパ","Oceania":"オセアニア"};
const STATUS={High:"high",Medium:"medium",Basic:"basic"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=n=>n===null||n===undefined||n===""?"—":Number(n).toLocaleString(lang==="ja"?"ja-JP":"en-US",{maximumFractionDigits:1});
const txt=k=>TEXT[lang]?.[k]||TEXT.ja[k]||k;
const short=s=>!s?"":String(s).length>260?String(s).slice(0,260)+"…":String(s);
const name=c=>c["country_"+lang]||c.country_ja||c.country||"";
const regionLabel=r=>lang==="ja"?(REGION_JA[r]||r):r;
const priorityLabel=p=>txt(STATUS[p]||String(p||"").toLowerCase())||p||"";
const CHILD_UNITS=["children","number of children",["#","of","children"].join(" ")];
const unitLabel=u=>CHILD_UNITS.includes(String(u||""))?txt("children"):u==="USD"?"USD":u||"";
const state={cards:[],rankings:{},metricMeta:{},q:"",region:"all",priority:"all",metric:"school_meals_total_children"};
async function loadJson(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error(path+" "+r.status);return r.json();}
function applyLang(){document.documentElement.lang=lang;$("#langSelect").value=lang;document.querySelectorAll("[data-t]").forEach(el=>el.textContent=txt(el.dataset.t));}
function regions(){return [...new Set(state.cards.map(x=>x.region).filter(Boolean))].sort();}
function filteredCards(){const q=state.q.toLowerCase();return state.cards.filter(c=>{const hay=JSON.stringify(c).toLowerCase();return(!q||hay.includes(q))&&(state.region==="all"||c.region===state.region)&&(state.priority==="all"||c.json_card_priority===state.priority)})}
function metricLabel(mid){return state.metricMeta[mid]?.metric_label_ja||state.metricMeta[mid]?.metric||mid}
function sourceNote(mid){return state.metricMeta[mid]?.ui_source_note_ja||state.metricMeta[mid]?.definition_note_ja||state.metricMeta[mid]?.primary_source_for_ranking||""}
function usableMetrics(){return Object.keys(state.rankings).filter(mid=>(state.rankings[mid]||[]).length>1)}
function referenceMetrics(){return Object.keys(state.rankings).filter(mid=>(state.rankings[mid]||[]).length===1)}
function renderCard(c){const infra=c.infrastructure||{},children=c.children||{},budget=c.budget||{},coverage=c.coverage||{},meal=c.meal_modalities||{},programs=c.programs_2021||[];const badges=[regionLabel(c.region),c.reference_school_year,priorityLabel(c.json_card_priority),infra.central_or_offsite_status_2021,infra.infrastructure_summary_ja].filter(Boolean);return `<article class="card"><h3>${esc(c.flag_emoji||"")} ${esc(name(c))} <span class="small muted">${esc(c.iso3||"")}</span></h3><div class="meta">${badges.map((b,i)=>`<span class="pill ${i>2?"green":""}">${esc(b)}</span>`).join("")}</div><div class="keyvals"><div class="kv"><b>${fmt(children.wfp_children_latest||children.gcnf_total_children_fed)}</b><span>${esc(txt("children"))}</span></div><div class="kv"><b>${fmt(budget.wfp_budget_usd||budget.gcnf_budget_usd)}</b><span>${esc(txt("budget"))} USD</span></div><div class="kv"><b>${fmt(coverage.coverage_rate_pct)}%</b><span>${esc(txt("coverage"))}</span></div><div class="kv"><b>${fmt(infra.central_kitchen_count_extracted_2021)}</b><span>${esc(txt("central"))}</span></div></div>${infra.infrastructure_summary_ja?`<div class="summary">${esc(infra.infrastructure_summary_ja)}</div>`:""}<table><tr><th>${esc(txt("program"))}</th><td>${esc(short(c.program_names)||"—")}</td></tr><tr><th>${esc(txt("agency"))}</th><td>${esc(short(c.lead_agency)||"—")}</td></tr><tr><th>${esc(txt("meal"))}</th><td>${esc(["朝食:"+meal.breakfast,"昼食:"+meal.lunch,"スナック:"+meal.snacks,"持ち帰り:"+meal.take_home_rations].filter(x=>!x.endsWith("undefined")&&!x.endsWith("null")).join(" / ")||"—")}</td></tr><tr><th>${esc(txt("facility"))}</th><td>${esc(["学校キッチン:"+infra.kitchens_category,"食堂:"+infra.cafeterias_category,"電気:"+infra.electricity_category,"清潔な水:"+infra.clean_water_category].filter(x=>!x.endsWith("undefined")&&!x.endsWith("null")).join(" / ")||"—")}</td></tr></table>${infra.infrastructure_text_2021?`<details><summary>${esc(txt("detail"))}</summary><p class="muted">${esc(infra.infrastructure_text_2021)}</p></details>`:""}${programs.length?`<details><summary>${esc(txt("programDetail"))} ${programs.length}</summary><table><thead><tr><th>${esc(txt("program"))}</th><th>頻度</th><th>対象</th><th>${esc(txt("children"))}</th></tr></thead><tbody>${programs.map(p=>`<tr><td>${esc(p.program||"")}</td><td>${esc(p.frequency||"")}</td><td>${esc(short(p.targeting)||"")}</td><td>${fmt(p.total_children_fed)}</td></tr>`).join("")}</tbody></table></details>`:""}</article>`}
function renderRankings(){const metrics=usableMetrics();if(!metrics.includes(state.metric))state.metric=metrics[0]||"";const list=(state.rankings[state.metric]||[]).slice(0,12);const refs=referenceMetrics();return `<div class="section-title"><h2>${esc(txt("ranking"))}</h2><div class="note">${esc(sourceNote(state.metric))}</div></div><div class="tools" style="grid-template-columns:1fr"><select id="metric">${metrics.map(mid=>`<option value="${esc(mid)}" ${mid===state.metric?"selected":""}>${esc(metricLabel(mid))}</option>`).join("")}</select></div><div class="rank-card"><h3>${esc(metricLabel(state.metric))}</h3>${list.length?list.map((r,i)=>`<div class="rank-row"><span class="rank-no">${i+1}</span><div><div class="rank-country">${esc(r.flag_emoji||"")} ${esc(r["country_"+lang]||r.country_ja||r.country)} <span class="small muted">${esc(r.iso3||"")}</span></div><div class="rank-val">${fmt(r.value)} ${esc(unitLabel(r.unit))}</div></div></div>`).join(""):`<div class="empty">—</div>`}<p class="muted small">${esc(txt("source"))}：${esc((list[0]&&list[0].source)||state.metricMeta[state.metric]?.primary_source_for_ranking||"")}</p></div><div class="rank-card"><h3>${esc(txt("reference"))}</h3><p class="muted">${esc(txt("policy"))}</p>${refs.map(mid=>{const r=state.rankings[mid][0];return `<div class="rank-row"><span class="rank-no">•</span><div><div class="rank-country">${esc(metricLabel(mid))}</div><div class="rank-val">${esc(r.country_ja||r.country)}：${fmt(r.value)} ${esc(unitLabel(r.unit))}</div></div></div>`}).join("")}</div>`}
function render(){applyLang();const regs=regions(),cards=filteredCards();app.innerHTML=`<div class="tools"><input id="q" value="${esc(state.q)}" placeholder="${esc(txt("search"))}"><select id="region"><option value="all">${esc(txt("allRegions"))}</option>${regs.map(r=>`<option value="${esc(r)}" ${state.region===r?"selected":""}>${esc(regionLabel(r))}</option>`).join("")}</select><select id="priority"><option value="all">${esc(txt("allStatus"))}</option><option value="High" ${state.priority==="High"?"selected":""}>${esc(txt("high"))}</option><option value="Medium" ${state.priority==="Medium"?"selected":""}>${esc(txt("medium"))}</option><option value="Basic" ${state.priority==="Basic"?"selected":""}>${esc(txt("basic"))}</option></select></div><div class="stats"><div class="stat"><b>${fmt(state.cards.length)}</b><span>国・地域</span></div><div class="stat"><b>${fmt(cards.length)}</b><span>表示中</span></div><div class="stat"><b>${fmt(regs.length)}</b><span>地域分類</span></div><div class="stat"><b>${fmt(state.cards.filter(c=>(c.infrastructure||{}).central_kitchen_count_extracted_2021).length)}</b><span>${esc(txt("central"))}</span></div></div><div class="section-title"><h2>${esc(txt("cards"))}</h2><div class="note">GCNF / WFP</div></div><div class="grid">${cards.length?cards.map(renderCard).join(""):`<div class="empty">${esc(txt("noRows"))}</div>`}</div>${renderRankings()}`;$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});$("#region").addEventListener("change",e=>{state.region=e.target.value;render()});$("#priority").addEventListener("change",e=>{state.priority=e.target.value;render()});const metric=$("#metric");if(metric)metric.addEventListener("change",e=>{state.metric=e.target.value;render()})}
$("#langSelect").addEventListener("change",e=>{lang=e.target.value;localStorage.setItem("mb_lang",lang);render()});
(async()=>{try{const [cards,rankings,sources]=await Promise.all([loadJson("data/school_meals_country_cards.json"),loadJson("data/school_meals_rankings.json"),loadJson("data/school_meals_sources.json")]);state.cards=cards.records||[];state.rankings=rankings.rankings_by_metric||{};state.metricMeta=rankings.metric_meta||sources.metric_meta||{};render()}catch(e){app.innerHTML=`<div class="empty">データを読み込めませんでした。<br>${esc(e.message)}</div>`;console.error(e)}})();
</script>
</body>
</html>
