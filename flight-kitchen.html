<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#0B3A82"/>
<title>世界の空厨・機内食キッチンDB | MARKET BASE</title>
<meta name="description" content="航空ケータリング会社、機内食キッチン、食品工場を国別に見られるMARKET BASEのデータベースです。"/>
<link href="assets/css/styles.css?v=243" rel="stylesheet"/>
<link href="flight-kitchen.css?v=243" rel="stylesheet"/>
<meta name="market-base-build" content="V242_INTERNAL_WORD_CLEAN_FLIGHT_JSON_SCHOOL_RANKING_FIX_20260707"/>
</head>
<body class="flight-page">
<header class="app-header flight-header">
  <div class="brand-block">
    <a class="logo-mark flight-logo" href="index.html" aria-label="MARKET BASEへ戻る">MB</a>
    <div>
      <a class="flight-back-text" href="index.html">← MARKET BASE</a>
      <p class="eyebrow">World Flight Kitchen DB</p>
      <h1>世界の空厨・機内食キッチンDB</h1>
      <p class="release-badge">空厨・航空ケータリング・食品工場</p>
    </div>
  </div>
  <div class="header-actions flight-header-actions">
    
    <button class="cache-refresh-btn" id="cacheRefreshBtn" type="button" aria-label="キャッシュを更新">更新</button>
    <select aria-label="Language" id="langSelect">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh_tw">繁體中文</option>
      <option value="zh_cn">简体中文</option>
    </select>
  </div>
</header>
<main class="flight-shell">
  <section class="flight-hero">
    <div>
      <h2>空港・航空会社に接続する食品製造拠点</h2>
      <p>航空ケータリング会社、機内食キッチン、食品工場、関連案件を一覧できます。</p>
    </div>
    <div class="flight-stat-grid" id="flightStats"></div>
  </section>
  <section class="flight-controls">
    <input id="flightSearch" type="search" placeholder="会社名・国・空港コード・食品カテゴリで検索"/>
    <select id="flightCountry"><option value="all">すべての国・地域</option></select>
    <select id="flightType"><option value="all">すべての会社種別</option></select>
    <select id="flightFoodFlag">
      <option value="all">食品接点すべて</option>
      <option value="rice">米飯系メニューあり</option>
      <option value="nonair">機内食以外の食品製造あり</option>
      <option value="project">プロジェクトあり</option>
    </select>
  </section>
  <section class="flight-summary-section">
    <div class="section-head"><div><h3>国・地域サマリー</h3><p>会社数・施設数・案件数の概要です。</p></div><span class="count-chip">上位18件</span></div>
    <div class="flight-country-grid" id="flightCountryGrid"></div>
  </section>
  <section class="flight-list-section">
    <div class="section-head"><div><h3>会社・施設カード</h3><p>会社、拠点、食品事業、関連案件を見られます。</p></div><div class="count-chip" id="flightCount"></div></div>
    <div class="flight-card-list" id="flightCards"></div>
  </section>
</main>
<dialog id="flightDialog"><button class="close" id="flightClose">×</button><div id="flightDetail"></div></dialog>
<script src="flight-kitchen.js?v=243"></script>
</body>
</html>
