<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CVS食品工場DB | MARKET BASE</title>
  <meta name="description" content="コンビニ向け食品工場・ベンダーの国別データベースです。" />
  <style>
    :root{--blue:#0B3A82;--blue2:#1759b8;--bg:#f5f8fc;--text:#132238;--muted:#607086;--line:#dbe7f6;--soft:#eef6ff;--green:#0f766e;--shadow:0 12px 28px rgba(11,58,130,.08)}
    *{box-sizing:border-box} html,body{max-width:100%;overflow-x:hidden} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:16px}.page{width:min(1120px,100%);margin:0 auto;padding:14px 12px 72px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--blue);background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-weight:950}.lang{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--blue);font-weight:900;padding:9px 10px;max-width:145px}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1{margin:0;color:var(--blue);font-size:clamp(1.35rem,5vw,2rem);line-height:1.2}.tools{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0}@media(min-width:820px){.tools{grid-template-columns:1.4fr .8fr .8fr}}input,select{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px;font:inherit;font-weight:850;background:#fff;color:var(--text)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 18px}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 18px rgba(11,58,130,.04);min-width:0}.stat b{display:block;color:var(--blue);font-size:1.35rem}.stat span{color:var(--muted);font-size:.84rem;font-weight:850}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:950;color:var(--blue)}.tabs button.active{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}h2{color:var(--blue);font-size:1.2rem;margin:22px 0 10px}.card h3{margin:0 0 8px;color:var(--blue);font-size:1.05rem;line-height:1.35;word-break:break-word}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pill{display:inline-flex;border-radius:999px;background:var(--soft);color:var(--blue);padding:5px 9px;font-size:.78rem;font-weight:950}.pill.green{background:#ecfdf5;color:var(--green)}.muted{color:var(--muted);font-size:.92rem;line-height:1.6;font-weight:750}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--muted);font-weight:850}.small{font-size:.82rem}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.88rem}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;word-break:break-word;line-height:1.45}th{width:34%;background:#f8fbff;color:var(--blue)}
  </style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <a class="back" href="./">← MARKET BASE</a>
    <select id="langSelect" class="lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh_tw">繁體中文</option><option value="zh_cn">简体中文</option></select>
  </div>
  <section class="hero"><h1 data-t="title">CVS食品工場DB</h1></section>
  <section id="cvsPage"></section>
</main>
<script>
let lang=localStorage.getItem("mb_lang")||"ja";
const T={ja:{title:"CVS食品工場DB",search:"会社・国・工場・カテゴリ・チェーンで検索",allCountries:"すべての国・地域",companies:"会社",factories:"工場・拠点",candidates:"調査候補",showing:"表示中",noData:"該当するデータがありません。",loadFail:"データを読み込めませんでした。",company:"会社データ",factory:"工場・拠点データ",candidate:"調査候補"},en:{title:"CVS Food Factory DB",search:"Search company, country, factory, category, or chain",allCountries:"All countries/areas",companies:"Companies",factories:"Factories/sites",candidates:"Research candidates",showing:"Showing",noData:"No matching data.",loadFail:"Could not load data.",company:"Companies",factory:"Factories/sites",candidate:"Research candidates"},zh_tw:{title:"CVS食品工廠DB",search:"搜尋公司、國家、工廠、分類、連鎖",allCountries:"所有國家／地區",companies:"公司",factories:"工廠・據點",candidates:"調查候選",showing:"顯示中",noData:"沒有符合資料。",loadFail:"資料讀取失敗。",company:"公司資料",factory:"工廠・據點資料",candidate:"調查候選"},zh_cn:{title:"CVS食品工厂DB",search:"搜索公司、国家、工厂、分类、连锁",allCountries:"所有国家／地区",companies:"公司",factories:"工厂・据点",candidates:"调查候选",showing:"显示中",noData:"没有符合数据。",loadFail:"数据读取失败。",company:"公司资料",factory:"工厂・据点资料",candidate:"调查候选"}};
const root=document.getElementById("cvsPage");
const state={companies:[],factories:[],candidates:[],q:"",country:"all",tab:"companies"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const rows=raw=>Array.isArray(raw)?raw:(raw?.records||raw?.data||raw?.rows||raw?.companies||raw?.factories||raw?.candidates||[]);
const pick=(o,ks)=>{for(const k of ks){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k]}return ""};
const tr=k=>T[lang]?.[k]||T.ja[k]||k;
function jpText(v){let s=String(v??"");if(lang!=="ja")return s;return s.replace(/7[- ]?Eleven/gi,"セブン‐イレブン").replace(/Seven[- ]?Eleven/gi,"セブン‐イレブン").replace(/FamilyMart/gi,"ファミリーマート").replace(/Lawson/gi,"ローソン").replace(/Ministop/gi,"ミニストップ");}
function countryOf(r){return pick(r,["country_area_ja","country_ja","country","market_country","country_or_region","region_country"])}
function nameOf(r){return pick(r,["company_name","factory_name","candidate_name","company_name_original","name"])}
function categoryOf(r){return pick(r,["manufacturing_category","handled_products_or_functions","candidate_type","category"])}
function countries(){return [...new Set([...state.companies,...state.factories,...state.candidates].map(countryOf).filter(Boolean))].sort()}
function activeRows(){return state[state.tab]||[]}
function filtered(){const q=state.q.toLowerCase();return activeRows().filter(r=>{const c=countryOf(r);return(state.country==="all"||c===state.country)&&(!q||JSON.stringify(r).toLowerCase().includes(q))})}
function card(r){const nm=jpText(nameOf(r)||"—"), c=jpText(countryOf(r)||"—"), cat=jpText(categoryOf(r)||"—"), status=jpText(pick(r,["status","research_stage","confidence_level","display_status"])||""), loc=jpText(pick(r,["factory_location","factory_location_summary","factory_or_location"])||""), cust=jpText(pick(r,["main_customers","possible_customer"])||"");return `<article class="card"><h3>${esc(nm)}</h3><div class="meta"><span class="pill">${esc(c)}</span>${status?`<span class="pill green">${esc(status)}</span>`:""}</div><table><tr><th>カテゴリ</th><td>${esc(cat)}</td></tr>${loc?`<tr><th>場所</th><td>${esc(loc)}</td></tr>`:""}${cust?`<tr><th>供給先・関連</th><td>${esc(cust)}</td></tr>`:""}<tr><th>次の調査</th><td>${esc(jpText(pick(r,["next_research_tasks","reason_for_watch"])||"—"))}</td></tr></table></article>`}
function applyLang(){document.documentElement.lang=lang;document.getElementById("langSelect").value=lang;document.querySelectorAll("[data-t]").forEach(el=>el.textContent=tr(el.dataset.t));}
function render(){applyLang();const cs=countries(), rows=filtered();root.innerHTML=`<div class="tools"><input id="q" value="${esc(state.q)}" placeholder="${esc(tr("search"))}"><select id="country"><option value="all">${esc(tr("allCountries"))}</option>${cs.map(c=>`<option value="${esc(c)}" ${state.country===c?"selected":""}>${esc(jpText(c))}</option>`).join("")}</select><select id="dummy"><option>${esc(tr("showing"))}</option></select></div><div class="stats"><div class="stat"><b>${state.companies.length.toLocaleString()}</b><span>${esc(tr("companies"))}</span></div><div class="stat"><b>${state.factories.length.toLocaleString()}</b><span>${esc(tr("factories"))}</span></div><div class="stat"><b>${state.candidates.length.toLocaleString()}</b><span>${esc(tr("candidates"))}</span></div><div class="stat"><b>${rows.length.toLocaleString()}</b><span>${esc(tr("showing"))}</span></div></div><div class="tabs"><button class="${state.tab==="companies"?"active":""}" data-tab="companies">${esc(tr("companies"))}</button><button class="${state.tab==="factories"?"active":""}" data-tab="factories">${esc(tr("factories"))}</button><button class="${state.tab==="candidates"?"active":""}" data-tab="candidates">${esc(tr("candidates"))}</button></div><h2>${esc(tr(state.tab==="companies"?"company":state.tab==="factories"?"factory":"candidate"))}</h2><div class="grid">${rows.length?rows.map(card).join(""):`<div class="empty">${esc(tr("noData"))}</div>`}</div>`;document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});document.getElementById("country").addEventListener("change",e=>{state.country=e.target.value;render()});document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",e=>{state.tab=e.currentTarget.dataset.tab;render()}))}
document.getElementById("langSelect").addEventListener("change",e=>{lang=e.target.value;localStorage.setItem("mb_lang",lang);render()});
Promise.all([fetch("data/market_base_cvs_vendor_companies_CURRENT.json").then(r=>r.json()),fetch("data/market_base_cvs_vendor_factories_CURRENT.json").then(r=>r.json()),fetch("data/market_base_cvs_vendor_research_candidates_CURRENT.json").then(r=>r.json())]).then(([a,b,c])=>{state.companies=rows(a);state.factories=rows(b);state.candidates=rows(c);render()}).catch(err=>{root.innerHTML=`<div class="empty">${esc(tr("loadFail"))}<br><span class="small">${esc(err.message)}</span></div>`});
</script>
</body>
</html>
