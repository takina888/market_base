<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国別コンビニ食品ベンダー工場データベース | MARKET BASE</title>
  <meta name="description" content="コンビニ向け食品ベンダー、工場、製造カテゴリ、追加調査候補を表示します。商品ラベル証拠や商品名は通常表示しません。" />
  <style>
    :root {
      --mb-blue:#0B3A82;
      --mb-blue-2:#1759b8;
      --mb-bg:#f5f8fc;
      --mb-card:#ffffff;
      --mb-text:#132238;
      --mb-muted:#607086;
      --mb-line:#dbe7f6;
      --mb-soft:#eef6ff;
      --mb-shadow:0 14px 34px rgba(11,58,130,.08);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      background:var(--mb-bg);
      color:var(--mb-text);
      font-size:16px;
    }
    a { color:inherit; }
    .page { max-width:1120px; margin:0 auto; padding:16px 14px 64px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .back {
      display:inline-flex; align-items:center; gap:8px; text-decoration:none;
      color:var(--mb-blue); background:#fff; border:1px solid var(--mb-line);
      border-radius:999px; padding:10px 15px; font-weight:950;
      box-shadow:0 8px 18px rgba(11,58,130,.04);
    }
    .status { color:var(--mb-muted); font-size:.82rem; font-weight:850; }
    .hero {
      background:linear-gradient(135deg,#fff 0%,#f6f9ff 60%,#eef6ff 100%);
      border:1px solid var(--mb-line); border-radius:26px; padding:22px;
      box-shadow:var(--mb-shadow);
    }
    .hero h1 { margin:0 0 8px; color:var(--mb-blue); font-size:clamp(1.45rem,4vw,2.25rem); line-height:1.15; letter-spacing:.01em; }
    .hero p { margin:0; color:var(--mb-muted); font-weight:800; line-height:1.75; }
    .tools { display:grid; grid-template-columns:1fr; gap:10px; margin:16px 0; }
    @media (min-width:760px) { .tools { grid-template-columns:1.3fr .85fr .85fr; } }
    input, select {
      width:100%; border:1px solid var(--mb-line); border-radius:16px;
      padding:13px 14px; font:inherit; font-weight:850; background:#fff; color:var(--mb-text);
      box-shadow:0 8px 18px rgba(11,58,130,.03);
    }
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0 18px; }
    @media (min-width:760px) { .stats { grid-template-columns:repeat(4,1fr); } }
    .stat { background:#fff; border:1px solid var(--mb-line); border-radius:18px; padding:14px; }
    .stat b { display:block; color:var(--mb-blue); font-size:1.45rem; line-height:1.1; }
    .stat span { color:var(--mb-muted); font-size:.86rem; font-weight:850; }
    .section-title { margin:22px 0 10px; color:var(--mb-blue); font-size:1.22rem; }
    .grid { display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width:860px) { .grid { grid-template-columns:repeat(2,1fr); } }
    .card {
      background:#fff; border:1px solid var(--mb-line); border-radius:20px; padding:16px;
      box-shadow:0 10px 24px rgba(11,58,130,.04);
    }
    .card h2 { margin:0 0 8px; color:var(--mb-blue); font-size:1.1rem; line-height:1.35; }
    .meta { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
    .pill { display:inline-flex; border-radius:999px; background:var(--mb-soft); color:var(--mb-blue); padding:5px 9px; font-size:.78rem; font-weight:950; }
    .muted { color:var(--mb-muted); font-size:.92rem; line-height:1.65; font-weight:750; }
    details { margin-top:10px; }
    summary { cursor:pointer; color:var(--mb-blue-2); font-weight:950; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:.9rem; }
    th,td { border-bottom:1px solid var(--mb-line); padding:9px 7px; text-align:left; vertical-align:top; line-height:1.45; }
    th { color:var(--mb-blue); background:#f8fbff; width:34%; }
    .empty { background:#fff; border:1px dashed var(--mb-line); border-radius:18px; padding:18px; color:var(--mb-muted); font-weight:850; }
    .small { font-size:.82rem; }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="back" href="./">← MARKET BASE</a>
      <div class="status">Standalone / 本体JS非統合</div>
    </div>
    <section class="hero">
      <h1>国別コンビニ食品ベンダー工場データベース</h1>
      <p>コンビニ向け食品ベンダー、工場、製造カテゴリ、追加調査候補を表示します。商品ラベル証拠や商品名は通常表示しません。</p>
    </section>
    <section id="cvsPage"></section>
  </main>
<script>

const state={companies:[],factories:[],candidates:[],q:'',country:'all',tab:'companies'};
const root=document.getElementById('cvsPage');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rows=raw=>Array.isArray(raw)?raw:(raw?.records||raw?.data||raw?.rows||[]);
const pick=(o,ks)=>{for(const k of ks){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];}return '';};
const country=r=>pick(r,['country','country_ja','country_name','market_country','country_or_region','region_country']);
const company=r=>pick(r,['company_name','company_name_en','company_name_ja','vendor_company','operator','name']);
const factory=r=>pick(r,['factory_name','site_name','plant_name','factory_or_site_name','name']);
const cat=r=>pick(r,['manufacturing_category','product_category','category','business_category','food_category']);
const stat=r=>pick(r,['research_stage','status','evidence_status','source_status','confirmation_status']);
const desc=r=>pick(r,['company_profile','company_detail','description','notes','business_summary','factory_detail','site_detail','next_research_tasks']);
function active(){return state.tab==='companies'?state.companies:state.tab==='factories'?state.factories:state.candidates;}
function render(){
  const countries=[...new Set([...state.companies,...state.factories,...state.candidates].map(country).filter(Boolean))].sort();
  const filtered=active().filter(r=>{
    const hay=JSON.stringify(r).toLowerCase();
    return (!state.q||hay.includes(state.q.toLowerCase())) && (state.country==='all'||country(r)===state.country);
  });
  root.innerHTML=`
    <div class="tools">
      <input id="q" value="${esc(state.q)}" placeholder="会社名・国・工場・カテゴリ・チェーンなどで検索">
      <select id="country"><option value="all">すべての国・地域</option>${countries.map(x=>`<option value="${esc(x)}" ${state.country===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select id="tab"><option value="companies" ${state.tab==='companies'?'selected':''}>会社</option><option value="factories" ${state.tab==='factories'?'selected':''}>工場・拠点</option><option value="candidates" ${state.tab==='candidates'?'selected':''}>追加調査候補</option></select>
    </div>
    <div class="stats">
      <div class="stat"><b>${state.companies.length}</b><span>会社</span></div>
      <div class="stat"><b>${state.factories.length}</b><span>工場・拠点</span></div>
      <div class="stat"><b>${state.candidates.length}</b><span>調査候補</span></div>
      <div class="stat"><b>${filtered.length}</b><span>表示中</span></div>
    </div>
    <h2 class="section-title">${state.tab==='companies'?'会社データ':state.tab==='factories'?'工場・拠点データ':'追加調査候補'}</h2>
    <div class="grid">${filtered.slice(0,180).map(card).join('')||'<div class="empty">該当するデータがありません。</div>'}</div>`;
  document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;render();});
  document.getElementById('country').addEventListener('change',e=>{state.country=e.target.value;render();});
  document.getElementById('tab').addEventListener('change',e=>{state.tab=e.target.value;render();});
}
function card(r){
  const title=state.tab==='factories'?factory(r):company(r);
  const pairs=Object.entries(r).filter(([k,v])=>{
    const lk=k.toLowerCase();
    if(lk.includes('product_name')||lk.includes('sku')||lk.includes('label_evidence')||lk.includes('rice_name_on_label'))return false;
    return v!==''&&v!==null&&v!==undefined;
  }).slice(0,30);
  return `<article class="card">
    <h2>${esc(title||'名称未設定')}</h2>
    <div class="meta">
      ${country(r)?`<span class="pill">${esc(country(r))}</span>`:''}
      ${cat(r)?`<span class="pill">${esc(cat(r))}</span>`:''}
      ${stat(r)?`<span class="pill">${esc(stat(r))}</span>`:''}
    </div>
    <p class="muted">${esc(desc(r)||'コンビニ食品ベンダー・工場調査用データです。')}</p>
    <details><summary>詳細データ</summary><table><tbody>${pairs.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></details>
  </article>`;
}
Promise.all([
  fetch('data/market_base_cvs_vendor_companies_CURRENT.json').then(r=>r.json()),
  fetch('data/market_base_cvs_vendor_factories_CURRENT.json').then(r=>r.json()),
  fetch('data/market_base_cvs_vendor_research_candidates_CURRENT.json').then(r=>r.json())
]).then(([a,b,c])=>{state.companies=rows(a);state.factories=rows(b);state.candidates=rows(c);render();}).catch(err=>{
  root.innerHTML=`<div class="empty">データを読み込めませんでした。<br><span class="small">${esc(err.message)}</span></div>`;
});

</script>
</body>
</html>
