*{box-sizing:border-box} html,body{max-width:100%;overflow-x:hidden} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:16px}.page{width:min(1180px,100%);margin:0 auto;padding:14px 12px 72px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.back,.cache-clear-button{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:999px;padding:9px 12px;font-weight:950;font-size:.9rem}.lang{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--blue);font-weight:900;padding:9px 10px;max-width:145px}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1{margin:0;color:var(--blue);font-size:clamp(1.35rem,5vw,2rem);line-height:1.2}.hero p{margin:8px 0 0;color:var(--muted);font-weight:800;line-height:1.65}.tools{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0}@media(min-width:900px){.tools{grid-template-columns:1.3fr .75fr .9fr .7fr}}input,select{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px;font:inherit;font-weight:850;background:#fff;color:var(--text);min-width:0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 18px}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 18px rgba(11,58,130,.04);min-width:0}.stat b{display:block;color:var(--blue);font-size:1.35rem}.stat span{color:var(--muted);font-size:.84rem;font-weight:850}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99 px}.topbar{align-items:flex-start}.top-actions{max-width:62%}}

<script>
let lang=localStorage.getItem("mb_lang")||"ja";
const T={
 ja:{title:"CVS食品工場DB",lead:"会社紹介を中心に、情報信頼性未確認データも分けて工場・拠点情報、供給先、製造カテゴリ、米飯関連を整理します。",search:"会社・国・工場・商品・チェーンで検索",allRegions:"すべての地域",allCountries:"すべての国・地域",allStatus:"すべて",company:"会社紹介・未確認情報",candidate:"情報信頼性未確認",country:"国別まとめ",companies:"会社",factories:"工場・拠点",candidates:"情報信頼性未確認",showing:"表示中",noData:"該当するデータがありません。",loadFail:"データを読み込めませんでした。",customer:"主な供給先",role:"会社の役割",category:"製造カテゴリ",products:"取扱商品・機能",rice:"米飯関連",scale:"能力・規模",status:"確認状況",next:"次に確認する点",factoryInfo:"工場・拠点情報",location:"所在地",source:"出典",summary:"国別まとめ"},
 en:{title:"CVS Food Factory DB",lead:"Company profiles with factories/sites, customers, categories, and rice-related supply information.",search:"Search company, country, factory, product, or chain",allRegions:"All regions",allCountries:"All countries/areas",allStatus:"All",company:"Company profiles + unverified info",candidate:"Reliability unverified",country:"Country summary",companies:"Companies",factories:"Factories/sites",candidates:"Reliability unverified",showing:"Showing",noData:"No matching data.",loadFail:"Could not load data.",customer:"Main customers",role:"Role",category:"Manufacturing category",products:"Products/functions",rice:"Rice-related",scale:"Capacity/scale",status:"Status",next:"Next checks",factoryInfo:"Factories/sites",location:"Location",source:"Sources",summary:"Country summary"},
 zh_tw:{title:"CVS食品工廠DB",lead:"以公司介紹為主，整理工廠據點、供應對象、製造分類與米飯相關資訊。",search:"搜尋公司、國家、工廠、商品、連鎖",allRegions:"所有地區",allCountries:"所有國家／地區",allStatus:"全部",company:"公司・候選一覽",candidate:"資訊可靠性未確認",country:"國別整理",companies:"公司",factories:"工廠・據點",candidates:"資訊可靠性未確認",showing:"顯示中",noData:"沒有符合資料。",loadFail:"資料讀取失敗。",customer:"主要供應對象",role:"公司角色",category:"製造分類",products:"商品・功能",rice:"米飯相關",scale:"能力・規模",status:"確認狀況",next:"下一步確認",factoryInfo:"工廠・據點資訊",location:"所在地",source:"來源",summary:"國別整理"},
 zh_cn:{title:"CVS食品工厂DB",lead:"以公司介绍为主，整理工厂据点、供应对象、制造分类与米饭相关信息。",search:"搜索公司、国家、工厂、商品、连锁",allRegions:"所有地区",allCountries:"所有国家／地区",allStatus:"全部",company:"公司・候选一览",candidate:"信息可靠性未确认",country:"国家整理",companies:"公司",factories:"工厂・据点",candidates:"信息可靠性未确认",showing:"显示中",noData:"没有符合数据。",loadFail:"数据读取失败。",customer:"主要供应对象",role:"公司角色",category:"制造分类",products:"商品・功能",rice:"米饭相关",scale:"能力・规模",status:"确认状况",next:"下一步确认",factoryInfo:"工厂・据点信息",location:"所在地",source:"来源",summary:"国家整理"}
};
const REGION_JA={Africa:"アフリカ",Americas:"アメリカ",Asia:"アジア",Europe:"ヨーロッパ",Oceania:"オセアニア"};
const root=document.getElementById("cvsPage");
const state={companies:[],candidates:[],q:"",region:"all",country:"all",status:"all",tab:"company"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
const tr=k=>T[lang]?.[k]||T.ja[k]||k;
const short=s=>!s?"":String(s).length>360?String(s).slice(0,360)+"…":String(s);
function jpText(v){
  let s=String(v??"");
  if(lang!=="ja")return s;
  [
    [/7[- ]?Eleven/gi,"セブン‐イレブン"],[/Seven[- ]?Eleven/gi,"セブン‐イレブン"],[/FamilyMart/gi,"ファミリーマート"],[/Lawson/gi,"ローソン"],[/Ministop/gi,"ミニストップ"],
    [/AEON/gi,"イオン"],[/Carrefour/gi,"カルフール"],[/Costco/gi,"コストコ"],[/Walmart/gi,"ウォルマート"],
    [/Central Kitchen/gi,"中央厨房"],[/central kitchen/gi,"中央厨房"],[/Cold Chain/gi,"冷鏈物流"],[/cold chain/gi,"冷鏈物流"],[/Ready-to-eat/gi,"RTE食品"],[/RTE/gi,"RTE食品"],
    [/Bakery/gi,"ベーカリー"],[/Protein/gi,"たんぱく系食品"],[/Factory/gi,"工場"],[/factory/gi,"工場"],[/candidate/gi,"候補"],[/needs_review/gi,"要確認"],[/factory_identified/gi,"工場情報あり"],[/core/gi,"主要データ"]
  ].forEach(([re,j])=>{s=s.replace(re,j)});
  return s;
}
function statusText(v){
  const s=String(v||"");
  if(lang!=="ja")return s;
  if(/A|verified|稼働開始|公式/i.test(s)) return "確認度：高";
  if(/B|identified|既存|確認/i.test(s)) return "確認度：中";
  if(/C|candidate|review|要確認|hidden/i.test(s)) return "要確認";
  return jpText(s||"確認中");
}
function regionLabel(r){return lang==="ja"?(REGION_JA[r]||r):r}
function countryName(c){return c["country_"+lang]||c.country_ja||c.country_area_ja||c.country||""}
function companyName(c){return c.company_name||c.company_name_original||""}
function countryList(){const all=state.companies.concat(state.candidates.map(candidateAsCompany));return [...new Map(all.map(c=>[c.__candidate?candidateCountryName(c.__raw||c):countryName(c),c]).filter(x=>x[0])).values()].sort((a,b)=>{const an=a.__candidate?candidateCountryName(a.__raw||a):countryName(a);const bn=b.__candidate?candidateCountryName(b.__raw||b):countryName(b);return an.localeCompare(bn,"ja")})}
function countriesForRegion(){return countryList().filter(c=>state.region==="all"||c.region===state.region)}
function regions(){return [...new Set(state.companies.map(c=>c.region).filter(Boolean))].sort()}
function candidateCountryName(c){return c["country_"+lang]||c.country_ja||c.country_area_ja||c.country||c.entity_id||""}
function candidateAsCompany(c){return {
  __candidate:true,
  company_name:c.candidate_name||c.company_name||c.factory_or_location||"情報信頼性未確認",
  company_name_original:c.candidate_name||"",
  country_ja:c.country_ja||c.country_area_ja||c.entity_id||"",
  country_en:c.country_en||c.country||c.entity_id||"",
  country_zh_tw:c.country_zh_tw||c.country_ja||c.entity_id||"",
  country_zh_cn:c.country_zh_cn||c.country_ja||c.entity_id||"",
  region:c.region||"",
  flag_emoji:c.flag_emoji||"",
  main_customers:c.possible_customer||"",
  manufacturing_category:c.manufacturing_category||c.candidate_type||"",
  handled_products_or_functions:c.factory_or_location||"",
  rice_related:c.rice_related||"",
  capacity_or_scale:c.capacity_or_scale||"",
  confirmation_status:c.confirmation_status||c.research_stage||c.status||"要確認",
  next_research_tasks:c.next_research_tasks||c.reason_for_watch||"",
  source_urls:c.source_urls||[],
  factories:[],
  __raw:c
}}
function activeRows(){return state.tab==="candidate"?state.candidates:(state.tab==="company"?state.companies.concat(state.candidates.map(candidateAsCompany)):state.companies)}
function filterRows(rows){const q=state.q.toLowerCase();return rows.filter(c=>{const country=c.__candidate?candidateCountryName(c.__raw||c):countryName(c);const hay=JSON.stringify(c).toLowerCase();const st=statusText(c.confirmation_status||c.confidence_level||c.research_stage||c.status);return(!q||hay.includes(q))&&(state.region==="all"||c.region===state.region)&&(state.country==="all"||country===state.country)&&(state.status==="all"||st===state.status)})}
function sourcesHtml(urls){const list=arr(urls).flatMap(x=>String(x||"").split(/[,\n]/)).map(x=>x.trim()).filter(x=>/^https?:\/\//.test(x)).slice(0,4);return list.length?`<div class="source-list">${list.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(tr("source"))}${i+1}</a>`).join("")}</div>`:""}
function factoriesHtml(c){const fs=c.factories||[];if(!fs.length)return "";return `<details><summary>${esc(tr("factoryInfo"))} ${fs.length}</summary>${fs.map(f=>`<div class="factory-item"><strong>${esc(jpText(f.factory_name||"工場・拠点"))}</strong><table>${f.factory_location?`<tr><th>${esc(tr("location"))}</th><td>${esc(jpText(f.factory_location))}</td></tr>`:""}${f.manufacturing_category?`<tr><th>${esc(tr("category"))}</th><td>${esc(jpText(f.manufacturing_category))}</td></tr>`:""}${f.handled_products_or_functions?`<tr><th>${esc(tr("products"))}</th><td>${esc(jpText(short(f.handled_products_or_functions)))}</td></tr>`:""}${f.capacity_or_scale?`<tr><th>${esc(tr("scale"))}</th><td>${esc(jpText(short(f.capacity_or_scale)))}</td></tr>`:""}</table>${sourcesHtml(f.source_urls)}</div>`).join("")}</details>`}
function companyCard(c){const country=countryName(c), status=statusText(c.confirmation_status||c.confidence_level||c.research_stage||c.status);return `<article class="card"><h3>${esc(c.flag_emoji||"")} ${esc(jpText(companyName(c)))}</h3>${c.__candidate?`<div class="meta"><span class="pill amber">情報信頼性未確認</span></div>`:""}${c.company_name_original&&c.company_name_original!==c.company_name?`<div class="subname">${esc(jpText(c.company_name_original))}</div>`:""}<div class="meta"><span class="pill">${esc(jpText(country))}</span><span class="pill green">${esc(status)}</span>${c.factory_count_known?`<span class="pill">${esc(c.factory_count_known)} ${esc(tr("factories"))}</span>`:""}</div><table>${c.main_customers?`<tr><th>${esc(tr("customer"))}</th><td>${esc(jpText(short(c.main_customers)))}</td></tr>`:""}${c.manufacturing_category?`<tr><th>${esc(tr("category"))}</th><td>${esc(jpText(short(c.manufacturing_category)))}</td></tr>`:""}${c.handled_products_or_functions?`<tr><th>${esc(tr("products"))}</th><td>${esc(jpText(short(c.handled_products_or_functions)))}</td></tr>`:""}${c.rice_related?`<tr><th>${esc(tr("rice"))}</th><td>${esc(jpText(short(c.rice_related)))}</td></tr>`:""}${c.capacity_or_scale?`<tr><th>${esc(tr("scale"))}</th><td>${esc(jpText(short(c.capacity_or_scale)))}</td></tr>`:""}${c.next_research_tasks?`<tr><th>${esc(tr("next"))}</th><td>${esc(jpText(short(arr(c.next_research_tasks).join(" / "))))}</td></tr>`:""}</table>${factoriesHtml(c)}${sourcesHtml(c.source_urls)}</article>`}
function candidateCard(c){const name=c.candidate_name||c.company_name||"調査候補";return `<article class="card"><h3>${esc(jpText(name))}</h3><div class="meta"><span class="pill amber">${esc(jpText(c.country_area_ja||c.country_ja||c.entity_id||""))}</span><span class="pill">${esc(statusText(c.confirmation_status||c.research_stage||c.status))}</span></div><table>${c.possible_customer?`<tr><th>${esc(tr("customer"))}</th><td>${esc(jpText(c.possible_customer))}</td></tr>`:""}${c.manufacturing_category?`<tr><th>${esc(tr("category"))}</th><td>${esc(jpText(short(c.manufacturing_category)))}</td></tr>`:""}${c.factory_or_location?`<tr><th>${esc(tr("location"))}</th><td>${esc(jpText(short(c.factory_or_location)))}</td></tr>`:""}${c.reason_for_watch?`<tr><th>${esc(tr("next"))}</th><td>${esc(jpText(short(c.reason_for_watch)))}</td></tr>`:""}</table>${sourcesHtml(c.source_urls)}</article>`}
function countrySummary(rows){const by={};rows.forEach(c=>{const k=c.__candidate?candidateCountryName(c.__raw||c):(countryName(c)||"—");by[k]??={country:k,count:0,candidates:0,factories:0,customers:new Set(),cats:new Set()};by[k].count++;if(c.__candidate)by[k].candidates++;by[k].factories+=(c.factories||[]).length;String(c.main_customers||"").split(/[\/;|]/).slice(0,6).forEach(x=>x.trim()&&by[k].customers.add(jpText(x.trim())));String(c.manufacturing_category||"").split(/[\/;|]/).slice(0,6).forEach(x=>x.trim()&&by[k].cats.add(jpText(x.trim())))});return Object.values(by).sort((a,b)=>(b.count+b.candidates)-(a.count+a.candidates))}
function summaryCard(x){return `<article class="card"><h3>${esc(jpText(x.country))}</h3><div class="keyvals"></div><table><tr><th>${esc(tr("companies"))}</th><td>${x.count}</td></tr><tr><th>${esc(tr("factories"))}</th><td>${x.factories}</td></tr><tr><th>${esc(tr("candidates"))}</th><td>${x.candidates||0}</td></tr><tr><th>${esc(tr("customer"))}</th><td>${esc([...x.customers].slice(0,8).join(" / ")||"—")}</td></tr><tr><th>${esc(tr("category"))}</th><td>${esc([...x.cats].slice(0,8).join(" / ")||"—")}</td></tr></table></article>`}
function applyLang(){document.documentElement.lang=lang;document.getElementById("langSelect").value=lang;document.querySelectorAll("[data-t]").forEach(el=>el.textContent=tr(el.dataset.t))}
function render(){applyLang();const rs=regions(), cs=countriesForRegion();if(state.country!=="all"&&!cs.some(c=>countryName(c)===state.country))state.country="all";const companyRows=filterRows(state.companies.concat(state.candidates.map(candidateAsCompany))), candidateRows=filterRows(state.candidates), active=state.tab==="candidate"?candidateRows:companyRows;const statusOptions=[...new Set(state.companies.map(c=>statusText(c.confirmation_status||c.confidence_level||c.research_stage||c.status)).filter(Boolean))].sort();const summary=countrySummary(companyRows);root.innerHTML=`<div class="tools"><input id="q" value="${esc(state.q)}" placeholder="${esc(tr("search"))}"><select id="region"><option value="all">${esc(tr("allRegions"))}</option>${rs.map(r=>`<option value="${esc(r)}" ${state.region===r?"selected":""}>${esc(regionLabel(r))}</option>`).join("")}</select><select id="country"><option value="all">${esc(tr("allCountries"))}</option>${cs.map(c=>`<option value="${esc(c.__candidate?candidateCountryName(c.__raw||c):countryName(c))}" ${state.country===(c.__candidate?candidateCountryName(c.__raw||c):countryName(c))?"selected":""}>${esc(c.flag_emoji||"")} ${esc(jpText(c.__candidate?candidateCountryName(c.__raw||c):countryName(c)))}</option>`).join("")}</select><select id="status"><option value="all">${esc(tr("allStatus"))}</option>${statusOptions.map(s=>`<option value="${esc(s)}" ${state.status===s?"selected":""}>${esc(s)}</option>`).join("")}</select></div><div class="stats"><div class="stat"><b>${state.companies.length.toLocaleString()}</b><span>${esc(tr("companies"))}</span></div><div class="stat"><b>${state.companies.reduce((a,c)=>a+(c.factories||[]).length,0).toLocaleString()}</b><span>${esc(tr("factories"))}</span></div><div class="stat"><b>${state.candidates.length.toLocaleString()}</b><span>${esc(tr("candidates"))}</span></div><div class="stat"><b>${active.length.toLocaleString()}</b><span>${esc(tr("showing"))}</span></div></div><div class="tabs"><button class="${state.tab==="company"?"active":""}" data-tab="company">${esc(tr("company"))}</button><button class="${state.tab==="candidate"?"active":""}" data-tab="candidate">${esc(tr("candidate"))}</button><button class="${state.tab==="country"?"active":""}" data-tab="country">${esc(tr("country"))}</button></div><h2>${esc(tr(state.tab))}</h2><div class="grid">${state.tab==="country"?(summary.length?summary.map(summaryCard).join(""):`<div class="empty">${esc(tr("noData"))}</div>`):(active.length?active.map(state.tab==="candidate"?candidateCard:companyCard).join(""):`<div class="empty">${esc(tr("noData"))}</div>`)}</div>`;document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});document.getElementById("region").addEventListener("change",e=>{state.region=e.target.value;if(state.country!=="all"&&!countriesForRegion().some(c=>countryName(c)===state.country))state.country="all";render()});document.getElementById("country").addEventListener("change",e=>{state.country=e.target.value;render()});document.getElementById("status").addEventListener("change",e=>{state.status=e.target.value;render()});document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",e=>{state.tab=e.currentTarget.dataset.tab;render()}))}
document.getElementById("langSelect").addEventListener("change",e=>{lang=e.target.value;localStorage.setItem("mb_lang",lang);render()});
fetch("data/market_base_cvs_company_cards_v189.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{state.companies=d.companies||[];state.candidates=d.candidates||[];render()}).catch(err=>{root.innerHTML=`<div class="empty">${esc(tr("loadFail"))}<br><span class="small">${esc(err.message)}</span></div>`});
</script>
<script>
async function mbClearCacheAndReload(){
  const keepLang = localStorage.getItem('mb_lang') || 'ja';
  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    sessionStorage.clear();
    localStorage.clear();
    localStorage.setItem('mb_lang', keepLang);
  }catch(e){ console.warn(e); }
  const url=new URL(location.href);
  url.searchParams.set('v', Date.now().toString());
  location.replace(url.toString());
}
</script>
