<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="market-base-site-build" content="MARKET_BASE_V333_1_BOTTOM_TOOL_MENU_RADIO_CURRENCY_SAFE_20260803">
  <meta name="market-base-page-build" content="MARKET_BASE_V333_1_BOTTOM_TOOL_MENU_RADIO_CURRENCY_SAFE_20260803">
  <title>世界のコンテナ輸送ルート | MARKET BASE</title>
  <link rel="stylesheet" href="world-route/market-base-ui-base.css?v=20260730-v324-simple-route">
  <link rel="stylesheet" href="world-route/world-route.css?v=20260730-v324-simple-route">
  <script defer src="world-route/world-route-data.js?v=20260730-v324-simple-route"></script>
  <script defer src="world-route/world-route.js?v=20260730-v324-simple-route"></script>
  
</head>
<body class="mbx-body">
  <div class="mbx-app">
    <div class="mbx-header-shell">
      <header class="mbx-header">
        <a class="mbx-brand" href="index.html">MARKET BASE</a>
        <div class="mbx-header-actions">
          <a class="mbx-header-button" href="index.html">戻る</a>
          <button class="mbx-header-button" type="button" data-mbx-refresh>更新</button>
        </div>
      </header>
    </div>

    <main class="mbx-main route-page-main">
      <header class="mbx-page-head route-page-head">
        <p class="mbx-page-kicker">WORLD ROUTE</p>
        <h1 class="mbx-page-title">世界のコンテナ輸送ルート</h1>
        <p class="mbx-page-description">国を選ぶと、日本から主な到着港までのおおよその流れを確認できます。</p>
      </header>

      <p class="route-error" data-route-error hidden></p>

      <div data-world-route-app>
        <section class="route-country-selector" aria-label="選択中の国">
          <div class="route-country-copy">
            <span class="route-small-label">行き先</span>
            <strong class="route-country-name" data-country-name aria-live="polite">台湾</strong>
            <span class="route-country-region" data-country-region>東アジア</span>
          </div>
          <button class="route-country-open" type="button" data-country-open aria-haspopup="dialog">国を選ぶ</button>
        </section>

        <section class="route-variant-block" data-route-variant-block hidden>
          <span class="route-small-label">ルートを選ぶ</span>
          <div class="route-variant-list" data-route-variants></div>
        </section>

        <section class="route-section" aria-labelledby="route-map-title">
          <h2 class="route-section-title" id="route-map-title">地図で見る</h2>
          <div class="route-map-frame" data-route-map role="img" aria-label="輸送ルート">
            <svg class="route-map-svg" data-route-map-svg viewBox="0 0 1000 500" aria-hidden="true"></svg>
          </div>
          <div class="route-map-key" aria-hidden="true">
            <span><i class="route-key-start"></i>出発</span>
            <span><i></i>経由</span>
            <span><i class="route-key-finish"></i>到着</span>
          </div>
        </section>

        <section class="route-section" aria-labelledby="route-flow-title">
          <h2 class="route-section-title" id="route-flow-title">日本から到着まで</h2>
          <ol class="route-flow" data-route-flow></ol>
        </section>

        <section class="route-section" aria-labelledby="route-port-title">
          <h2 class="route-section-title" id="route-port-title">主な到着港</h2>
          <ul class="route-port-list" data-route-ports></ul>
          <div class="route-note-box">
            <p data-route-note></p>
            <p class="route-duration">所要日数は便ごとに確認してください。</p>
          </div>
        </section>

        <section class="route-section" data-route-sources-section aria-labelledby="route-source-title">
          <h2 class="route-section-title" id="route-source-title">公式確認先</h2>
          <div class="route-sources" data-route-sources></div>
        </section>

        <nav class="route-country-navigation" aria-label="国の前後移動">
          <button class="route-nav-button" type="button" data-route-prev>前の国</button>
          <span class="route-position" data-route-position aria-live="polite">1 / 20</span>
          <button class="route-nav-button" type="button" data-route-next>次の国</button>
        </nav>

        <footer class="route-footer">
          <a class="route-home-link" href="index.html">メインページへ戻る</a>
        </footer>
      </div>
    </main>
  </div>

  <dialog class="route-country-dialog" data-country-dialog aria-labelledby="country-dialog-title">
    <div class="route-dialog-layout">
      <header class="route-dialog-header">
        <h2 class="route-dialog-title" id="country-dialog-title">国を選ぶ</h2>
        <button class="route-dialog-close" type="button" data-country-close>閉じる</button>
      </header>
      <input class="route-country-search" type="search" data-country-search aria-label="国名で絞り込む" placeholder="国名で絞り込む" autocomplete="off">
      <div class="route-country-list" data-country-list></div>
    </div>
  </dialog>
<script src="assets/js/market-base-update-controller-v333.js?v=20260803-v333-1-bottom-tool-menu-radio-currency-safe" data-mb-update-controller></script></body>
</html>
