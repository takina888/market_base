<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF3F9">
  <meta name="robots" content="noindex,nofollow">
  <title>MARKET BASE｜Samsung Internet用ショートカット</title>
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png" sizes="180x180">
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;background:#eef3f9;color:#102b50}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#f8fbff,#eaf2fb)}
    main{width:min(560px,100%);padding:26px 22px;border:1px solid #d5e3f2;border-radius:26px;background:#fff;box-shadow:0 20px 60px rgba(10,45,104,.13)}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin-bottom:16px;border-radius:20px;background:linear-gradient(135deg,#0a2d68,#1769d9);color:#fff;font-size:22px;font-weight:950;letter-spacing:.06em}
    h1{margin:0;color:#082e68;font-size:clamp(25px,7vw,34px);line-height:1.25}
    p{margin:12px 0;color:#4c647e;font-weight:700;line-height:1.75}
    ol{margin:18px 0;padding-left:24px;color:#284d73;font-weight:800;line-height:1.8}
    .note{padding:12px 14px;border:1px solid #d8e5f3;border-radius:15px;background:#f4f8fd;font-size:13px}
    a{display:flex;align-items:center;justify-content:center;min-height:50px;margin-top:16px;padding:11px 15px;border-radius:15px;background:#0968d7;color:#fff;text-align:center;text-decoration:none;font-weight:950}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">MB</div>
    <h1>ホーム画面ショートカットを作る</h1>
    <p>この専用ページにはPWAマニフェストを読み込んでいません。Samsung InternetがAndroidアプリ（WebAPK）を生成する経路を使わず、ブラウザで開くショートカットを作ります。</p>
    <ol>
      <li>Samsung Internetのメニュー（≡）を開きます。</li>
      <li>「ページを追加」→「ホーム画面」を選びます。</li>
      <li>追加されたMARKET BASEアイコンを押します。</li>
    </ol>
    <p class="note">この画面を開いたまま追加してください。次回、ホーム画面のアイコンから開くとMARKET BASEへ移動します。</p>
    <a href="../index.html?from=samsung-shortcut">今すぐMARKET BASEへ戻る</a>
  </main>
  <script>
    (function () {
      var launchHash = '#open-market-base';
      if (window.location.hash === launchHash) {
        window.location.replace('../index.html?from=samsung-shortcut');
        return;
      }
      window.history.replaceState(null, '', window.location.pathname + window.location.search + launchHash);
    })();
  </script>
</body>
</html>
