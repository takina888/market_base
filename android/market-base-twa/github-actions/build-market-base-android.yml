name: Build MARKET BASE Android

on:
  pull_request:
    paths:
      - "android/market-base-twa/**"
      - ".github/workflows/build-market-base-android.yml"
  push:
    branches: [main]
    paths:
      - "android/market-base-twa/**"
      - ".github/workflows/build-market-base-android.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: android/market-base-twa

jobs:
  verify:
    name: Static check, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify the security contract
        run: node scripts/static-verify.mjs

      - name: Lint and compile a non-distributable debug APK
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleDebug

  signed-release:
    name: Signed release APK and AAB
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    env:
      MARKET_BASE_KEYSTORE_BASE64: ${{ secrets.MARKET_BASE_KEYSTORE_BASE64 }}
      MARKET_BASE_STORE_PASSWORD: ${{ secrets.MARKET_BASE_STORE_PASSWORD }}
      MARKET_BASE_KEY_ALIAS: ${{ secrets.MARKET_BASE_KEY_ALIAS }}
      MARKET_BASE_KEY_PASSWORD: ${{ secrets.MARKET_BASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check required release secrets
        run: |
          for name in MARKET_BASE_KEYSTORE_BASE64 MARKET_BASE_STORE_PASSWORD MARKET_BASE_KEY_ALIAS MARKET_BASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the android-release environment"
              exit 1
            fi
          done

      - name: Decode the release keystore
        run: printf '%s' "$MARKET_BASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/market-base-release.jks"

      - name: Verify, lint, and build signed release artifacts
        env:
          ORG_GRADLE_PROJECT_MARKET_BASE_STORE_FILE: ${{ runner.temp }}/market-base-release.jks
          ORG_GRADLE_PROJECT_MARKET_BASE_STORE_PASSWORD: ${{ secrets.MARKET_BASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MARKET_BASE_KEY_ALIAS: ${{ secrets.MARKET_BASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MARKET_BASE_KEY_PASSWORD: ${{ secrets.MARKET_BASE_KEY_PASSWORD }}
        run: |
          node scripts/static-verify.mjs
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature and render Digital Asset Links
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          RAW_FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [ -z "$RAW_FINGERPRINT" ]; then
            echo "::error::Unable to read the release certificate fingerprint"
            exit 1
          fi
          export MARKET_BASE_SHA256_CERT_FINGERPRINT
          MARKET_BASE_SHA256_CERT_FINGERPRINT=$(printf '%s' "$RAW_FINGERPRINT" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')
          scripts/render-assetlinks.sh digital-asset-links/assetlinks.json.template build/generated-assetlinks/assetlinks.json

      - name: Create downloadable artifact checksums
        run: |
          (
            cd app/build/outputs/apk/release
            sha256sum app-release.apk > app-release.apk.sha256
          )
          (
            cd app/build/outputs/bundle/release
            sha256sum app-release.aab > app-release.aab.sha256
          )

      - uses: actions/upload-artifact@v4
        with:
          name: market-base-signed-release
          path: |
            android/market-base-twa/app/build/outputs/apk/release/app-release.apk
            android/market-base-twa/app/build/outputs/apk/release/app-release.apk.sha256
            android/market-base-twa/app/build/outputs/bundle/release/app-release.aab
            android/market-base-twa/app/build/outputs/bundle/release/app-release.aab.sha256
            android/market-base-twa/build/generated-assetlinks/assetlinks.json
          if-no-files-found: error

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/market-base-release.jks"
